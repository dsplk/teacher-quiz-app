{% extends "base.html" %}
{% block content %}
<div class="row mb-3">
    <div class="col-12">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h4 class="mb-0"><i class="fas fa-pencil-alt text-primary me-2"></i>刷题模式</h4>
            <div class="d-flex gap-2 flex-wrap">
                <select class="form-select form-select-sm" id="category-select" style="width:auto;">
                    <option value="">全部类别</option>
                    {% for cat in categories|sort %}
                    {% if cat != "未分类" %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
                <select class="form-select form-select-sm" id="count-select" style="width:auto;">
                    <option value="5">5题</option>
                    <option value="10" selected>10题</option>
                    <option value="20">20题</option>
                    <option value="50">50题</option>
                </select>
                <button class="btn btn-primary btn-sm" onclick="startPractice()">
                    <i class="fas fa-play me-1"></i>开始
                </button>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-lg-8">
        <div id="practice-area">
            <div class="empty-state">
                <i class="fas fa-hand-pointer"></i>
                <p class="mt-2">选择类别和题数，点击"开始"按钮</p>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="card">
            <div class="card-header bg-white py-2">
                <small class="fw-bold"><i class="fas fa-list me-1"></i>答题进度</small>
            </div>
            <div class="card-body p-3">
                <div id="progress-info" class="text-center text-muted py-4">
                    <small>尚未开始练习</small>
                </div>
                <div id="result-summary" class="d-none">
                    <div class="d-flex justify-content-around text-center">
                        <div>
                            <div class="fw-bold text-success fs-4" id="correct-count">0</div>
                            <small class="text-muted">正确</small>
                        </div>
                        <div>
                            <div class="fw-bold text-danger fs-4" id="wrong-count">0</div>
                            <small class="text-muted">错误</small>
                        </div>
                        <div>
                            <div class="fw-bold fs-4" id="answered-count">0</div>
                            <small class="text-muted">已答</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentQuestions = [];
let currentIdx = 0;
let results = {};
let answered = false;

function startPractice() {
    const cat = document.getElementById('category-select').value;
    const count = parseInt(document.getElementById('count-select').value);
    const params = new URLSearchParams({ count });
    if (cat) params.set('category', cat);

    fetch(`/api/random-questions?${params}`)
        .then(r => r.json())
        .then(qs => {
            currentQuestions = qs;
            currentIdx = 0;
            results = {};
            answered = false;
            showQuestion();
            updateProgress();
        });
}

function showQuestion() {
    const area = document.getElementById('practice-area');
    area.innerHTML = '';

    if (currentIdx >= currentQuestions.length) {
        showResults();
        return;
    }

    const q = currentQuestions[currentIdx];
    const div = renderQuestion(q, currentIdx, false);
    const opts = div.querySelectorAll('.option-item');

    opts.forEach(el => {
        el.addEventListener('click', () => handleAnswer(currentIdx, el.dataset.optLabel));
    });

    area.appendChild(div);

    // Progress indicator
    const prog = document.createElement('div');
    prog.className = 'text-center text-muted mt-2';
    prog.innerHTML = `<small>第 ${currentIdx + 1} / ${currentQuestions.length} 题</small>`;
    area.appendChild(prog);

    updateProgress();
}

function handleAnswer(idx, userAnswer) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[idx];
    const correct = userAnswer === q.answer;
    results[idx] = { correct, userAnswer };

    // Show correct/wrong on options
    const opts = document.querySelectorAll('.option-item');
    opts.forEach(el => {
        el.classList.add('disabled');
        if (el.dataset.optLabel === q.answer) el.classList.add('correct');
        if (el.dataset.optLabel === userAnswer && !correct) el.classList.add('wrong');
        if (el.dataset.optLabel === userAnswer) el.classList.add('selected');
    });

    // Show answer with explanation
    const qCard = document.querySelector('.question-card .card-body');
    const ansDiv = document.createElement('div');
    ansDiv.className = 'answer-reveal mt-3 p-3 rounded';
    const hasExp = q.explanation && q.explanation.length > 0;
    if (correct) {
        ansDiv.style.background = hasExp ? '#f8fafc' : '#f0fdf4';
        ansDiv.style.border = hasExp ? '1px solid #e2e8f0' : '1px solid #bbf7d0';
        let html = `<strong style="color:#16a34a;">✓ 正确！答案：${q.answer}</strong>`;
        if (hasExp) {
            html += `<div class="mt-2 pt-2" style="border-top:1px dashed #e2e8f0;color:#374151;font-size:0.9rem;line-height:1.7;">📖 <strong>解析：</strong>${q.explanation}</div>`;
        }
        ansDiv.innerHTML = html;
    } else {
        ansDiv.style.background = '#fef2f2';
        ansDiv.style.border = '1px solid #fecaca';
        let html = `<strong style="color:#dc2626;">✗ 错误</strong> 你的答案：${userAnswer} | 正确答案：<strong>${q.answer}</strong>`;
        if (hasExp) {
            html += `<div class="mt-2 pt-2" style="border-top:1px dashed #fecaca;color:#374151;font-size:0.9rem;line-height:1.7;">📖 <strong>解析：</strong>${q.explanation}</div>`;
        }
        ansDiv.innerHTML = html;
        recordWrong(q.idx, userAnswer, q.answer);
    }
    qCard.appendChild(ansDiv);

    // Log practice
    logPractice(q.idx, correct, q.major_category);

    // Next button
    const btnDiv = document.createElement('div');
    btnDiv.className = 'mt-3 text-end';
    if (currentIdx < currentQuestions.length - 1) {
        btnDiv.innerHTML = `<button class="btn btn-primary" onclick="nextQuestion()">
            <i class="fas fa-arrow-right me-1"></i>下一题
        </button>`;
    } else {
        btnDiv.innerHTML = `<button class="btn btn-success" onclick="showResults()">
            <i class="fas fa-check me-1"></i>查看结果
        </button>`;
    }
    qCard.appendChild(btnDiv);

    updateProgress();
}

function nextQuestion() {
    currentIdx++;
    answered = false;
    showQuestion();
}

function updateProgress() {
    const total = currentQuestions.length;
    const done = Object.keys(results).length;
    const correct = Object.values(results).filter(r => r.correct).length;
    const wrong = done - correct;

    document.getElementById('correct-count').textContent = correct;
    document.getElementById('wrong-count').textContent = wrong;
    document.getElementById('answered-count').textContent = done;

    const info = document.getElementById('progress-info');
    if (total === 0) {
        info.innerHTML = '<small>尚未开始练习</small>';
        document.getElementById('result-summary').classList.add('d-none');
    } else {
        info.innerHTML = `<small>总题数: ${total} | 已完成: ${done} | 正确率: ${done > 0 ? Math.round(correct/done*100) : 0}%</small>`;
        document.getElementById('result-summary').classList.remove('d-none');
    }
}

function showResults() {
    const area = document.getElementById('practice-area');
    const total = currentQuestions.length;
    const correct = Object.values(results).filter(r => r.correct).length;
    const pct = total > 0 ? Math.round(correct/total*100) : 0;

    area.innerHTML = `
        <div class="card text-center p-5">
            <div class="card-body">
                <div class="mb-3">
                    <div style="font-size:4rem;">${pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '📚'}</div>
                </div>
                <h4>练习完成！</h4>
                <p class="text-muted">共 ${total} 题，正确 ${correct} 题，错误 ${total - correct} 题</p>
                <div class="progress progress-thin mb-3" style="height:12px;max-width:300px;margin:0 auto;">
                    <div class="progress-bar bg-success" style="width:${pct}%">${pct}%</div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary me-2" onclick="startPractice()">
                        <i class="fas fa-redo me-1"></i>再来一次
                    </button>
                    <a href="/wrong-book" class="btn btn-danger">
                        <i class="fas fa-book me-1"></i>查看错题
                    </a>
                    <button class="btn btn-outline-secondary" onclick="reviewResults()">
                        <i class="fas fa-list me-1"></i>逐题回顾
                    </button>
                </div>
            </div>
        </div>
    `;
}

function reviewResults() {
    currentIdx = 0;
    answered = true; // prevent re-answering
    showQuestion();
    // Override next button to show all in review mode
}
</script>
{% endblock %}
