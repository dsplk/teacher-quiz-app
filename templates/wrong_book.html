{% extends "base.html" %}
{% block content %}
<div class="row mb-3">
    <div class="col-12">
        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h4 class="mb-0"><i class="fas fa-book text-danger me-2"></i>错题本</h4>
            <div class="d-flex gap-2">
                <select class="form-select form-select-sm" id="wrong-cat-select" style="width:auto;">
                    <option value="">全部分类</option>
                    {% for cat in categories|sort %}
                    {% if cat != "未分类" %}
                    <option value="{{ cat }}">{{ cat }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>
</div>

<div id="wrong-list">
    <div class="empty-state">
        <i class="fas fa-inbox"></i>
        <p class="mt-2">正在加载...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let wrongQuestionsCache = {};

document.addEventListener('DOMContentLoaded', loadWrongAnswers);
document.getElementById('wrong-cat-select').addEventListener('change', loadWrongAnswers);

async function loadWrongAnswers() {
    const cat = document.getElementById('wrong-cat-select').value;
    const params = cat ? `?category=${encodeURIComponent(cat)}` : '';
    const items = await api(`/api/wrong-answers${params}`);
    await renderWrongList(items);
}

async function fetchQuestionsForItems(items) {
    const idxs = [...new Set(items.map(i => i.question_idx))];
    const qs = await Promise.all(idxs.map(idx => api(`/api/question/${idx}`)));
    idxs.forEach((idx, i) => { wrongQuestionsCache[idx] = qs[i]; });
}

async function renderWrongList(items) {
    const container = document.getElementById('wrong-list');
    container.innerHTML = '';

    if (items.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-check-circle text-success" style="font-size:4rem;"></i>
                <h5 class="mt-3 text-muted">暂无错题</h5>
                <p class="text-muted">继续保持！去刷题页面练习吧</p>
                <a href="/practice" class="btn btn-primary"><i class="fas fa-pencil-alt me-1"></i>开始刷题</a>
            </div>
        `;
        return;
    }

    await fetchQuestionsForItems(items);

    items.forEach(item => {
        const q = wrongQuestionsCache[item.question_idx];
        if (!q) return;

        const itemDiv = document.createElement('div');
        itemDiv.className = `card wrong-item mb-3 ${item.reviewed ? 'reviewed' : ''}`;

        const body = document.createElement('div');
        body.className = 'card-body p-3';

        const header = document.createElement('div');
        header.className = 'd-flex justify-content-between align-items-start mb-2';
        header.innerHTML = `
            <div>
                <span class="badge bg-light text-dark me-1">${q.exam}</span>
                <span class="badge bg-primary me-1">${q.major_category}</span>
                <span class="badge bg-secondary">第${q.number}题</span>
            </div>
            <div>
                ${!item.reviewed
                    ? `<button class="btn btn-sm btn-outline-success me-1" onclick="markReviewed(${item.id})"><i class="fas fa-check"></i></button>`
                    : `<span class="badge bg-success bg-opacity-10 text-success me-1">已复习</span>`
                }
                <button class="btn btn-sm btn-outline-danger" onclick="deleteWrong(${item.id})"><i class="fas fa-trash"></i></button>
            </div>
        `;
        body.appendChild(header);

        const qText = document.createElement('div');
        qText.className = 'mb-2';
        qText.textContent = q.text.replace(/^\d+\s*[\.\、\s]\s*/, '').substring(0, 200);
        body.appendChild(qText);

        const ansInfo = document.createElement('div');
        ansInfo.className = 'd-flex gap-3 flex-wrap';
        ansInfo.innerHTML = `
            <span class="text-danger"><strong>你的答案：</strong>${item.user_answer}</span>
            <span class="text-success"><strong>正确答案：</strong>${item.correct_answer}</span>
            <span class="text-muted"><small>${item.created_at}</small></span>
        `;
        body.appendChild(ansInfo);

        itemDiv.appendChild(body);
        container.appendChild(itemDiv);
    });
}

function markReviewed(id) {
    api(`/api/wrong-answer/${id}/review`, { method: 'POST' }).then(loadWrongAnswers);
}

function deleteWrong(id) {
    if (!confirm('确定删除这条错题记录？')) return;
    api(`/api/wrong-answer/${id}`, { method: 'DELETE' }).then(loadWrongAnswers);
}
</script>
{% endblock %}
